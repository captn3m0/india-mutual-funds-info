name: Probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - run: pipx install uv
    - name: Probe blocked sites
      run: |
        uv run python - <<'PY'
        import sys
        sys.path.insert(0, "src")
        from portfolio.base import session
        import time
        API = "https://www.invescomutualfund.com/api"
        for imp in (None, "chrome"):
            s = session(imp)
            for i in range(3):
                for u in (f"{API}/ClassificationCompleteMonthlyHoldings", f"{API}/CompleteMonthlyHoldings?year=0",
                          f"{API}/CompleteMonthlyHoldings?year=2026&classification=Equity"):
                    r = s.get(u, timeout=60)
                    print(imp, i, r.status_code, len(r.content), r.headers.get("content-type"), u[-60:], "|", " ".join(r.text[:300].split()))
                    time.sleep(0.2)
        PY
